name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Version Tag in Artifact Registry (e.g. v1.0.9)'
        required: true

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  rollback:
    name: Rollback Image Tag & Surge Replace MIG
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1040668556711/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider'
          service_account: 'sa-abe-github-cicd@gcp-ace-501516.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: 'gcp-ace-501516'

      - name: Repoint :latest Tag to Target Version in Artifact Registry
        run: |
          IMAGE_URI="asia-southeast2-docker.pkg.dev/gcp-ace-501516/abe-porto-repo/abe-backend"
          echo "Repointing :latest -> ${{ inputs.target_version }}..."
          gcloud artifacts docker tags add \
            "${IMAGE_URI}:${{ inputs.target_version }}" \
            "${IMAGE_URI}:latest"

      - name: Zero-Downtime Surge Replace on App MIG
        run: |
          gcloud compute instance-groups managed rolling-action replace abe-app-mig \
            --region=asia-southeast2 \
            --max-surge=2 \
            --max-unavailable=0
          echo "Rollback to ${{ inputs.target_version }} triggered with zero downtime!"