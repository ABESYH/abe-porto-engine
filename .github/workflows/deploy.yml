name: Deploy ABE PORTO to GCP

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: 'write'
  id-token: 'write'

jobs:
  deploy:
    name: Build, Version & Rolling Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1040668556711/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc-provider'
          service_account: 'sa-abe-github-cicd@gcp-ace-501516.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: 'gcp-ace-501516'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast2-docker.pkg.dev --quiet

      - name: Build and Tag Backend Image (Semantic Versioning)
        run: |
          IMAGE_URI="asia-southeast2-docker.pkg.dev/gcp-ace-501516/abe-porto-repo/abe-backend"
          VERSION_TAG="v1.0.${{ github.run_number }}"
          
          echo "Building version: $VERSION_TAG (Commit: ${{ github.sha }})"
          
          docker build \
            --build-arg APP_VERSION="${VERSION_TAG}" \
            -t "${IMAGE_URI}:${{ github.sha }}" \
            -t "${IMAGE_URI}:${VERSION_TAG}" \
            -t "${IMAGE_URI}:latest" \
            ./backend
            
          docker push "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:${VERSION_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy Frontend to GCS Web Bucket
        run: |
          sed -i "s/__APP_RELEASE__/v1.0.${{ github.run_number }}/g" ./frontend/index.html
          gcloud storage cp --cache-control="no-cache, max-age=0" ./frontend/index.html gs://abe-porto-web-501516/index.html

      - name: Zero-Downtime Surge Replace on App MIG
        run: |
          gcloud compute instance-groups managed rolling-action replace abe-app-mig \
            --region=asia-southeast2 \
            --max-surge=2 \
            --max-unavailable=0
      
      - name: Create and Push Git Tag Automatically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG_NAME="v1.0.${{ github.run_number }}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Successfully created and pushed Git Tag: $TAG_NAME"