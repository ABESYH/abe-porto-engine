name: Build and Push AI Inference Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/build-worker.yml'
  workflow_dispatch:

env:
  DOCKER_WORKER_IMAGE: ${{ secrets.REGISTRY_NAMESPACE }}/ai-engine-worker

jobs:
  build-worker:
    runs-on: [self-hosted, linux, x64, gcp-gpu-builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Worker Delta Layer (Host Daemon Cache)
        run: |
          docker build \
            --build-arg REGISTRY_NAMESPACE=${{ secrets.REGISTRY_NAMESPACE }} \
            -t ${{ env.DOCKER_WORKER_IMAGE }}:${{ steps.vars.outputs.sha_short }} \
            -t ${{ env.DOCKER_WORKER_IMAGE }}:latest \
            -f worker/Dockerfile \
            worker/

          # Push only the lightweight worker delta layer (~5MB)
          docker push ${{ env.DOCKER_WORKER_IMAGE }}:${{ steps.vars.outputs.sha_short }}
          docker push ${{ env.DOCKER_WORKER_IMAGE }}:latest