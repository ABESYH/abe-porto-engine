name: Build and Push AI Base Image

on:
  push:
    paths:
      - 'base/**'
      - '.github/workflows/build-base.yml'
  workflow_dispatch:

env:
  DOCKER_BASE_IMAGE: ${{ secrets.REGISTRY_NAMESPACE }}/ai-engine-base

jobs:
  build-base:
    runs-on: [self-hosted, linux, x64, gcp-gpu-builder]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Heavy Model Base Layer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/Dockerfile
          push: true
          build-args: |
            MODEL_CHECKPOINT_URL=${{ secrets.MODEL_CHECKPOINT_URL }}
            MODEL_ENCODER_URL=${{ secrets.MODEL_ENCODER_URL }}
            MODEL_UPSCALER_URL=${{ secrets.MODEL_UPSCALER_URL }}
          tags: |
            ${{ env.DOCKER_BASE_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_BASE_IMAGE }}:latest
          cache-to: type=inline